name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      # Java SDL2 (SDLActivity) otomatis diambil bila belum ada
      - name: Ambil Java SDL2
        run: |
          D=app/src/main/java/org/libsdl/app
          if [ -z "$(ls -A $D 2>/dev/null)" ]; then
            git clone --depth 1 --branch release-2.30.x https://github.com/libsdl-org/SDL /tmp/SDL
            mkdir -p $D && cp /tmp/SDL/android-project/app/src/main/java/org/libsdl/app/*.java $D/
          fi
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: ChangedSpecial-launcher-debug, path: app/build/outputs/apk/debug/*.apk }
