name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Ambil Java SDL2
        run: |
          D=app/src/main/java/org/libsdl/app
          if [ -z "$(ls -A $D 2>/dev/null)" ]; then
            git clone --depth 1 --branch release-2.30.x https://github.com/libsdl-org/SDL /tmp/SDL
            mkdir -p $D
            cp /tmp/SDL/android-project/app/src/main/java/org/libsdl/app/*.java $D/
          fi
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Ringkasan error
        if: failure()
        run: |
          echo '### Error build' >> $GITHUB_STEP_SUMMARY
          grep -E -A4 "^e: |What went wrong|error:" build.log | head -60 >> $GITHUB_STEP_SUMMARY || true
      - uses: actions/upload-artifact@v4
        with:
          name: ChangedSpecial-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
